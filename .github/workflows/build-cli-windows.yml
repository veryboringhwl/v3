name: Build CLI (Windows)

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag
        required: true
        type: string
      arch:
        description: Architecture
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.arch == 'amd64' && 'x86_64-pc-windows-msvc' || inputs.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'i686-pc-windows-msvc' }}

      - name: Setup WiX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install -g wix
          wix extension add -g WixToolset.Util.wixext
          wix extension add -g WixToolset.UI.wixext

      - name: Build
        shell: pwsh
        working-directory: cli/build/windows
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.ps1 -version "${{ inputs.tag }}" -platform "${{ inputs.arch }}"

      - name: Attest
        uses: actions/attest@v4
        with:
          subjects: cli/build/windows/dist/*

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows-${{ inputs.arch }}
          path: cli/build/windows/dist/*
