name: Release Creator

on:
  push:
    tags: ["creator-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: creator-linux-x86_64

          - os: macos-13
            target: x86_64-apple-darwin
            asset: creator-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            asset: creator-macos-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: creator-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: creator

      - name: Stage binary
        shell: pwsh
        working-directory: creator
        run: |
          $targetDir = "${{ matrix.target }}".Replace('-', '_')
          $binary = if ("${{ runner.os }}".StartsWith("Windows")) { "creator.exe" } else { "creator" }
          $src = "target/${{ matrix.target }}/release/$binary"
          Copy-Item -Path $src -Destination "${{ matrix.asset }}"

      - uses: softprops/action-gh-release@v3.0.0
        with:
          files: creator/${{ matrix.asset }}

  publish-jsr:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: denoland/setup-deno@v2.0.4
        with:
          deno-version: v2.x

      - name: Publish to JSR
        working-directory: creator/jsr
        run: deno publish
