name: Release All

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: CLI version (e.g. 1.0.0)
        required: true
        type: string
      hooks_version:
        description: Hooks version (e.g. 1.0.0)
        required: true
        type: string
      creator_version:
        description: Creator version (e.g. 1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    name: Tag & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create and push tags
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "v${{ inputs.cli_version }}"
          git tag "hooks-v${{ inputs.hooks_version }}"
          git tag "creator-v${{ inputs.creator_version }}"
          git push origin "v${{ inputs.cli_version }}" "hooks-v${{ inputs.hooks_version }}" "creator-v${{ inputs.creator_version }}"
